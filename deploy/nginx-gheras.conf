# Gheras — its own server block on port 3000; no other site's config is touched.
# Install as /etc/nginx/sites-available/gheras and enable with
# `deploy/provision.sh --enable-site` (runs `nginx -t` before a graceful reload).
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /var/www/gheras/frontend;
    index index.html;

    # Photo uploads are capped at 6 MB by the backend.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend's rate limits read the caller's IP from here.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Videos stream with byte ranges.
        proxy_buffering off;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
